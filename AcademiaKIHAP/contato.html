<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Contato - KIHAP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bodycontato">
  <header class="topo">
    <div class="logo">
      <img src="src/logo.png" alt="Logo KIHAP">
    </div>
    <nav class="menu">
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="dicas.html">DICAS</a></li>
        <li class="dropdown">
          <a href="#">MODALIDADES</a>
          <ul class="submenu">
            <li><a href="muay-thai.html">Muay-Thai</a></li>
            <li><a href="jiu-jitsu.html">Jiu-Jitsu</a></li>
            <li><a href="karate.html">Karatê</a></li>
          </ul>
        </li>
        <li><a href="contato.html">CONTATO</a></li>
      </ul>
    </nav>
  </header>

  <div class="contato-fundo">

  <main class="contato-container">
    <h2>📬 Fale com a KIHAP</h2>
    <p>Preencha o formulário abaixo com sua dúvida, sugestão ou interesse em treinar conosco. Estamos prontos para te atender!</p>

    <form class="formulario-contato">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX">

      <label for="modalidade">Modalidade de interesse:</label>
      <select id="modalidade" name="modalidade">
        <option value="">Selecione</option>
        <option value="muaythai">Muay-Thai</option>
        <option value="jiujitsu">Jiu-Jitsu</option>
        <option value="karate">Karatê</option>
      </select>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua dúvida ou sugestão..."></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>
  </div>
</body>
</html>
